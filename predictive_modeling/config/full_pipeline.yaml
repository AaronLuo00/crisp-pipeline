# Full Pipeline - Traditional ML + Deep Learning

models:
  traditional:
    enabled: true
    types: [LogisticRegression, RandomForest, GradientBoosting, XGBoost]
  deep_learning:
    enabled: true
    types: [LSTM, GRU]

training:
  test_size: 0.2
  use_smote: true
  cross_validation: 5
  random_state: 42  # For reproducibility
  # Deep learning specific
  max_epochs: 100
  batch_size: 32
  early_stopping: true
  patience: 10

features:
  use_time_series: true  # For deep learning
  sequence_length: 48    # 48 hours of data

tasks:
  mortality: true
  readmission: true
  los: true
  sepsis: true