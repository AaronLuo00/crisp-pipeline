# CRISP Pipeline Conda Environment
# Create environment: conda env create -f environment.yml
# Activate environment: conda activate crisp-pipeline

name: crisp-pipeline
channels:
  - conda-forge
  - defaults
  # - pytorch  # Uncomment when using PyTorch packages

dependencies:
  # Python version
  - python=3.8
  
  # Core data processing
  - pandas>=1.3.0
  - numpy>=1.21.0
  
  # Progress bars
  - tqdm>=4.65.0
  
  # Visualization
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # Jupyter notebooks support
  - jupyter
  - ipykernel
  
  # Scientific computing
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  

  # Deep Learning (PyTorch) - uncomment when ready to use deep learning models
  # Choose ONE of the following based on your hardware:
  
  # For CPU-only (recommended for testing):
  # - pytorch>=2.0.0
  # - cpuonly
  
  # For NVIDIA GPU (CUDA 11.8):
  # - pytorch>=2.0.0
  # - pytorch-cuda=11.8
  # - cudatoolkit=11.8
  
  # For NVIDIA GPU (CUDA 12.1):
  # - pytorch>=2.0.0 
  # - pytorch-cuda=12.1
  
  # Development tools (optional)
  - ipython
  - black  # Code formatter
  - pylint  # Code linter
  
  # Additional packages via pip
  - pip
  - pip:
      # Statistical algorithms (not available in conda)
      - tdigest>=0.5.1  # T-Digest algorithm for efficient percentile calculation
      
      # Traditional Machine Learning
      - xgboost>=2.0.0
      - imbalanced-learn>=0.11.0
      
      